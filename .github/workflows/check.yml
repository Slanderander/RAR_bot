name: Rad am Ring tjek bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Overlappende kørsler kan ellers læse samme status og sende alarmen to gange
concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - uses: actions/cache/restore@v4
        with:
          path: status.txt
          key: rar-status-${{ github.run_id }}
          restore-keys: rar-status-
      - run: python RAR_bot.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MODTAGERE: ${{ secrets.MODTAGERE }}
          ALARM_MODTAGER: ${{ secrets.ALARM_MODTAGER }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('status.txt') != ''
        with:
          path: status.txt
          key: rar-status-${{ github.run_id }}
